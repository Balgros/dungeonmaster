<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live-Notizen</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <h1>Live-Notizen</h1>
        <p>Session-Logbuch mit Autosave und Export.</p>
      </div>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="foundry.html">Foundry</a>
        <a href="kampagne.html">Kampagne</a>
        <a class="active" href="notizen.html">Notizen</a>
        <a href="initiative.html">Initiative</a>
        <a href="spieler.html">Spieler</a>
        <a href="ai.html">DungeonMasterAI</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="section">
        <h2>Session-Notizen</h2>
        <div class="page-grid">
          <div class="stack">
            <label>Notizen (auto-save)</label>
            <div class="notes" id="live-notes" contenteditable="true" data-placeholder="Hier während der Session tippen ..."></div>
            <div class="footer-actions">
              <button class="secondary" id="export-notes">Notizen exportieren</button>
              <button class="secondary" id="import-notes">Notizen importieren</button>
              <button class="danger" id="reset-notes">Notizen löschen</button>
            </div>
          </div>
          <div class="stack">
            <h3>Workflow</h3>
            <p class="small">Exportiere am Ende der Session eine JSON-Datei, um Backups zu behalten.</p>
            <div class="stat">
              <span class="small">Autosave</span>
              <strong>Aktiv</strong>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
