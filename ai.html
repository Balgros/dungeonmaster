<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DungeonMasterAI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <h1>DungeonMasterAI</h1>
        <p>GPT-Chat in einem eingebetteten Fenster.</p>
      </div>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="foundry.html">Foundry</a>
        <a href="kampagne.html">Kampagne</a>
        <a href="notizen.html">Notizen</a>
        <a href="initiative.html">Initiative</a>
        <a href="spieler.html">Spieler</a>
        <a class="active" href="ai.html">DungeonMasterAI</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="section">
        <h2>DungeonMasterAI Chat</h2>
        <p class="small">Fester Embed-Link: https://chat.openai.com/g/gpt-dungeonmaster</p>
      </section>

      <section class="section iframe-card">
        <h2>Chatfenster</h2>
        <iframe id="gpt-frame" title="DungeonMasterAI" src="https://chat.openai.com/g/gpt-dungeonmaster"></iframe>
      </section>

      <section class="section">
        <h2>Chatlog</h2>
        <label for="chat-log">Notizen aus dem GPT-Chat</label>
        <textarea id="chat-log" class="notes" rows="8" placeholder="Wichtige Antworten hier festhalten ..."></textarea>
        <div class="footer-actions">
          <button class="secondary" id="export-chatlog">Chatlog exportieren</button>
          <button class="secondary" id="import-chatlog">Chatlog importieren</button>
          <button class="danger" id="reset-chatlog">Chatlog löschen</button>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
